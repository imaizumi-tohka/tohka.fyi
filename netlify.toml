# ビルド設定は Netlify の管理画面側にあるため、ここでは触らない。
# ハッシュ付きアセット（/_astro/*）を immutable でキャッシュさせる。
[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
